<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Stundenplan</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stundenplan">
<meta name="theme-color" content="#16181e">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: App-Shell. Dunkle Kopfleiste (Monat, KW, Tagesleiste), wischbarer Inhalt in der Mitte, Tab-Leiste unten. */
:root{
  --bg:#eef0f4; --surface:#ffffff; --surface-2:#e3e6ed; --line:#dde0e7;
  --fg:#14161b; --muted:#5d6472; --on:#ffffff; --knob:#ffffff; --warn:#c0281e;
  --hdr:#16181e; --hdr-fg:#f4f5f8; --hdr-muted:#9097a5; --hdr-chip:#262a33;
  --bar:#ffffff;
  --f-display:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  /* Fachfarben: frei = Pflicht-Vollton, sem = Seminar, out = Umrandung freiwillig */
  --hoema-frei:#23458f; --hoema-sem:#3d6bcc; --hoema-out:#2b54ad;
  --get3-frei:#8f3a0c;  --get3-sem:#c25412;  --get3-out:#b0490f;
  --ml-frei:#17603a;    --ml-sem:#26864c;    --ml-out:#1d7646;
  --hst-frei:#8d1c55;   --hst-sem:#bf3a7d;   --hst-out:#a8236a;
  --hbe-frei:#4d2c95;   --hbe-sem:#7550d0;   --hbe-out:#5e3ab5;
  --ring-frei:#0f5c61;  --ring-sem:#21858b;  --ring-out:#137178;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b0c10; --surface:#171a20; --surface-2:#252a33; --line:#272c35;
  --fg:#eceef2; --muted:#98a0ad; --warn:#ff8a80;
  --hdr:#14161c; --hdr-chip:#262a33; --bar:#121419;
  --hoema-out:#8fb0ff; --get3-out:#ffab7a; --ml-out:#7fd9a0; --hst-out:#ff8cc4; --hbe-out:#b89cff; --ring-out:#6fd3d8;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0b0c10; --surface:#171a20; --surface-2:#252a33; --line:#272c35;
  --fg:#eceef2; --muted:#98a0ad; --warn:#ff8a80;
  --hdr:#14161c; --hdr-chip:#262a33; --bar:#121419;
  --hoema-out:#8fb0ff; --get3-out:#ffab7a; --ml-out:#7fd9a0; --hst-out:#ff8cc4; --hbe-out:#b89cff; --ring-out:#6fd3d8;
  color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;touch-action:manipulation}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
h1,h2,h3,p{margin:0}

/* App shell */
.app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.hdr{flex:none;background:var(--hdr);color:var(--hdr-fg);padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.hdr-in{max-width:720px;margin:0 auto}
.hrow{display:flex;align-items:center;gap:8px;min-height:44px}
.htitle{flex:1;min-width:0}
.htitle h1{font-family:var(--f-display);font-size:25px;font-weight:700;letter-spacing:-.015em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htitle h1 span{color:var(--hdr-muted);font-weight:600}
.htitle p{font-size:13px;color:var(--hdr-muted);font-weight:500;margin-top:2px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{height:34px;padding:0 14px;border-radius:17px;border:0;background:var(--hdr-chip);color:var(--hdr-fg);font-weight:700;font-size:13.5px}
.ib{width:34px;height:34px;border-radius:17px;border:0;background:var(--hdr-chip);color:var(--hdr-fg);display:grid;place-items:center;flex:none}
.ib svg{width:18px;height:18px}
.ib:disabled{opacity:.3;cursor:default}
.pill:active,.ib:active{transform:scale(.94)}
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:12px}
.sd{border:0;background:transparent;color:var(--hdr-fg);border-radius:14px;padding:6px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:background-color .2s,color .2s}
.sd .wd{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--hdr-muted);transition:color .2s}
.sd .dn{font-family:var(--f-display);font-size:20px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.sd .dots{display:flex;gap:3px;height:5px}
.sd .dots i{width:5px;height:5px;border-radius:50%}
.sd.today{box-shadow:inset 0 0 0 1.5px var(--hdr-chip)}
.sd.today .wd{color:var(--hdr-fg)}
.sd.sel{background:var(--hdr-fg);color:var(--hdr);box-shadow:none}
.sd.sel .wd{color:var(--hdr);opacity:.6}

.stage{flex:1;min-height:0;position:relative;overflow:hidden}
.pager{position:absolute;inset:0;overflow:hidden;touch-action:pan-y}
.track{position:absolute;inset:0;will-change:transform}
.panel,.single{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
.panel:nth-child(1){transform:translateX(-100%)}
.panel:nth-child(3){transform:translateX(100%)}
.pi{max-width:720px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
.fade{animation:fade .2s ease-out}
@keyframes fade{from{opacity:.35;transform:translateY(6px)}to{opacity:1;transform:none}}

.tabbar{flex:none;background:var(--bar);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 6px) max(8px,env(safe-area-inset-left,0px))}
.tabbar-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 0;color:var(--muted);font-size:11px;font-weight:700}
.tab .ic{width:54px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background-color .2s}
.tab svg{width:23px;height:23px}
.tab[aria-selected="true"]{color:var(--fg)}
.tab[aria-selected="true"] .ic{background:var(--surface-2)}

/* Fach + Stufe */
.m-hoema{--c-frei:var(--hoema-frei);--c-sem:var(--hoema-sem);--c-out:var(--hoema-out)}
.m-get3{--c-frei:var(--get3-frei);--c-sem:var(--get3-sem);--c-out:var(--get3-out)}
.m-ml{--c-frei:var(--ml-frei);--c-sem:var(--ml-sem);--c-out:var(--ml-out)}
.m-hst{--c-frei:var(--hst-frei);--c-sem:var(--hst-sem);--c-out:var(--hst-out)}
.m-hbe{--c-frei:var(--hbe-frei);--c-sem:var(--hbe-sem);--c-out:var(--hbe-out)}
.m-ring{--c-frei:var(--ring-frei);--c-sem:var(--ring-sem);--c-out:var(--ring-out)}
.m-pue{--c-frei:var(--hbe-frei);--c-sem:var(--hbe-sem);--c-out:var(--hbe-out)}
.t-frei{background:var(--surface);color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--c-out)}
.t-sem{background:var(--c-sem);color:var(--on)}
.t-pfl{background:var(--c-frei);color:var(--on)}
.m-pue.t-pfl{background:linear-gradient(115deg,var(--hst-frei) 15%,var(--hbe-frei) 85%)}

/* Tagesansicht */
.dhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
.dhead h2{font-family:var(--f-display);font-size:28px;font-weight:700;letter-spacing:-.015em;line-height:1.1}
.dhead p{font-size:14px;color:var(--muted);font-weight:500;margin-top:3px}
.dsum{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--surface);color:var(--muted);white-space:nowrap}
.chip.strong{background:var(--fg);color:var(--bg)}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.ev{display:grid;grid-template-columns:46px minmax(0,1fr);gap:12px}
.evt{padding-top:14px;font-family:var(--f-mono);font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:3px;line-height:1.1}
.evt b{font-weight:600;font-size:14px}
.evt span{font-size:12.5px;color:var(--muted)}
.ev.past{opacity:.45}
.gap{display:grid;grid-template-columns:46px minmax(0,1fr);gap:12px;align-items:center;margin-block:-2px}
.gap span{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.gap span::after{content:"";flex:1;border-top:1.5px dashed var(--line)}
.card{border-radius:18px;padding:14px 16px 15px;display:flex;flex-direction:column;gap:5px;min-width:0;position:relative;overflow:hidden}
.ck{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}
.t-frei .ck{color:var(--c-out)}
.t-sem .ck,.t-pfl .ck{color:var(--on)}
.ck .k{opacity:.9}
.bdg{margin-left:auto;font-size:10px;font-weight:800;letter-spacing:.08em;padding:3px 8px;border-radius:999px;background:var(--on);color:var(--c-frei)}
.cl{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;margin-top:3px}
.t-frei .cl{color:var(--c-out)}
.cl i{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 1.6s ease-in-out infinite;flex:none}
@keyframes pulse{50%{opacity:.3}}
.ct{font-family:var(--f-display);font-size:19px;font-weight:700;line-height:1.2;letter-spacing:-.005em;hyphens:manual;overflow-wrap:break-word}
.cm{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;margin-top:1px}
.cm svg{width:14px;height:14px;flex:none}
.t-frei .cm{color:var(--muted)} .t-frei .cm svg{color:var(--c-out)}
.cn{font-size:13.5px;opacity:.88}
.t-frei .cn{color:var(--muted);opacity:1}
.cx{font-size:12.5px;font-weight:700;color:var(--warn)}
.t-sem .cx,.t-pfl .cx{color:var(--on)}
.prog{position:absolute;left:0;bottom:0;height:4px;background:currentColor;opacity:.35;border-radius:0 2px 2px 0}
.t-frei .prog{background:var(--c-out);opacity:.6}
.frs{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.frist{display:flex;align-items:center;gap:12px;border-radius:16px;padding:12px 14px}
.frist .fi{width:30px;height:30px;border-radius:50%;background:var(--on);color:var(--c-frei);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.frist .fx{min-width:0;display:flex;flex-direction:column;gap:1px}
.frist b{font-size:15px;font-weight:700}
.frist span{font-size:13px;opacity:.88}
.done{text-align:center;color:var(--muted);font-size:13.5px;font-weight:600;margin-top:22px}
.empty{text-align:center;color:var(--muted);padding:56px 16px;font-size:14px}
.empty b{display:block;font-family:var(--f-display);font-size:22px;color:var(--fg);margin-bottom:6px}
.empty svg{width:44px;height:44px;color:var(--line);margin-bottom:10px}

/* Woche */
.wg{display:grid;grid-template-columns:24px repeat(5,minmax(0,1fr));gap:0 4px}
.wh{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;padding:0 0 8px;color:var(--muted)}
.wh span{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.wh b{font-family:var(--f-display);font-size:17px;color:var(--fg);font-variant-numeric:tabular-nums}
.wh.today b{background:var(--fg);color:var(--bg);border-radius:9px;padding:0 6px}
.wh i{font-style:normal;font-size:9.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:1px 5px;border-radius:5px;margin-top:2px;background:var(--hbe-frei);color:var(--on)}
.hrs{position:relative}
.hrs span{position:absolute;right:3px;font-family:var(--f-mono);font-size:10px;color:var(--muted);transform:translateY(-50%)}
.wc{position:relative;background:var(--surface);border-radius:12px;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 59px,var(--line) 59px,var(--line) 60px)}
.blk{position:absolute;border:0;border-radius:8px;padding:4px 5px;overflow:hidden;text-align:left;font-size:10.5px;line-height:1.2;display:flex;flex-direction:column;gap:1px}
.blk b{font-weight:800;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.9}
.t-frei.blk b{color:var(--c-out)}
.t-frei.blk span{color:var(--muted);opacity:1}
.blk.tiny{padding:0 5px;justify-content:center}
.blk.tiny b{font-size:9.5px;line-height:12px}
@media (max-width:370px){.htitle h1{font-size:22px}.htitle h1 span{display:none}.pill{padding:0 11px}}
.dhead{flex-wrap:wrap}.dsum{margin-left:auto}
.nowl{position:absolute;left:0;right:0;height:2px;background:var(--warn);z-index:2;pointer-events:none}
.nowl::before{content:"";position:absolute;left:-2px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--warn)}
.leg{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 18px;margin-top:16px;font-size:12.5px;font-weight:600;color:var(--muted)}
.leg span{display:flex;align-items:center;gap:7px}
.leg i{width:18px;height:12px;border-radius:4px}
.leg .l1{box-shadow:inset 0 0 0 1.5px var(--muted)}
.leg .l2{background:var(--muted);opacity:.6}
.leg .l3{background:var(--fg)}

/* Pflicht */
.hero{border-radius:22px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:3px;margin-bottom:6px}
.hero .hl{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.hero .ht{font-family:var(--f-display);font-size:23px;font-weight:700;line-height:1.15;margin-top:2px}
.hero .hm{font-size:14px;font-weight:600;opacity:.92}
.hero .hc{font-family:var(--f-display);font-size:30px;font-weight:700;margin-top:10px;line-height:1}
.sh{font-size:12.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:24px 4px 8px}
.lst{background:var(--surface);border-radius:18px;overflow:hidden}
.pr{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 14px}
.pr+.pr{border-top:1px solid var(--line)}
.pr.past{opacity:.45}
.pd{width:44px;height:46px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.pd b{font-family:var(--f-display);font-size:19px;font-variant-numeric:tabular-nums}
.pd span{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.pt{min-width:0}
.pt b{display:block;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcd{font-size:12.5px;font-weight:700;color:var(--muted);white-space:nowrap;text-align:right}
.pcd.soon{color:var(--fg)}
.wide{width:100%;margin-top:18px;border:0;background:var(--surface);border-radius:14px;padding:13px;font-weight:700;color:var(--muted)}

/* Einstellungen */
.grp+.grp{margin-top:24px}
.grp h3{font-size:12.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 4px 8px}
.li{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:12px 14px;text-align:left;min-height:54px}
.li+.li,.lrow+.lrow{border-top:1px solid var(--line)}
.lt{flex:1;min-width:0}
.lt b{display:block;font-weight:700;font-size:15px}
.lt span{display:block;font-size:13px;color:var(--muted)}
.lt em{display:block;font-style:normal;font-size:12.5px;color:var(--warn);font-weight:700;margin-top:1px}
.chk{width:22px;height:22px;flex:none;opacity:0}
.li[aria-pressed="true"] .chk{opacity:1}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:54px}
.sw{appearance:none;-webkit-appearance:none;width:51px;height:31px;border-radius:16px;background:var(--surface-2);position:relative;flex:none;margin:0;cursor:pointer;transition:background-color .2s}
.sw::before{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:var(--knob);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw:checked{background:var(--fg)}
.sw:checked::before{transform:translateX(20px)}
.lg{display:grid;grid-template-columns:minmax(0,1fr) repeat(3,40px);gap:10px;align-items:center;padding:10px 14px;font-size:14px;font-weight:600}
.lg+.lg{border-top:1px solid var(--line)}
.lg.h{font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding-block:10px 4px;text-align:center}
.lg.h span:first-child{text-align:left}
.swt{height:22px;border-radius:6px}
.notes{margin:0;padding:12px 14px 12px 32px;display:flex;flex-direction:column;gap:8px;font-size:13.5px;color:var(--muted)}
.foot{text-align:center;font-size:12px;color:var(--muted);margin-top:24px}

@media (prefers-reduced-motion:reduce){.fade{animation:none}.cl i{animation:none}.sd,.tab .ic,.sw,.sw::before{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="hdr">
    <div class="hdr-in">
      <div class="hrow">
        <div class="htitle"><h1 id="hTitle">Stundenplan</h1><p id="hSub"></p></div>
        <button class="pill" id="todayBtn">Heute</button>
        <button class="ib" id="prevBtn" aria-label="Vorherige Woche"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5L8 12l6.5 6.5"/></svg></button>
        <button class="ib" id="nextBtn" aria-label="Nächste Woche"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 5.5L16 12l-6.5 6.5"/></svg></button>
      </div>
      <div class="strip" id="strip"></div>
    </div>
  </header>
  <main class="stage">
    <div class="pager" id="pager"><div class="track" id="track"><section class="panel"></section><section class="panel"></section><section class="panel"></section></div></div>
    <div class="single" id="single" hidden></div>
  </main>
  <nav class="tabbar" aria-label="Ansichten">
    <div class="tabbar-in" role="tablist">
      <button class="tab" role="tab" data-v="tag" id="tab-tag"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><rect x="7.5" y="13" width="4.5" height="4" rx="1" fill="currentColor" stroke="none"/></svg></span>Tag</button>
      <button class="tab" role="tab" data-v="woche" id="tab-woche"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M9.2 10v10.5M14.8 10v10.5M8 3v4M16 3v4"/></svg></span>Woche</button>

<script>
(function(){

const SEM_START='2026-10-12', SEM_END='2027-02-05';
const FREE=[['2026-11-01','2026-11-01'],['2026-12-23','2027-01-04']];
const MODS={
  hoema:{name:'Höhere Mathematik',short:'HöMa'},

/* ---------- Datum ---------- */
const D=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const add=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x};
const mins=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const isFree=s=>FREE.some(([a,b])=>s>=a&&s<=b);
const monday=d=>add(d,-((d.getDay()+6)%7));
const isWE=d=>d.getDay()===0||d.getDay()===6;
const kwOf=d=>{const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const w=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-w);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)};
const dm=d=>String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.';
const nowMin=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const dayDiff=(a,b)=>Math.round((D(a)-D(b))/864e5);
function fmtDur(m){m=Math.max(0,Math.round(m));const h=Math.floor(m/60),r=m%60;return h?(r?h+' h '+r+' min':h+' h'):r+' min'}
function weekly(first,fn){for(let d=D(first);iso(d)<=SEM_END;d=add(d,7)){const s=iso(d);if(!isFree(s))fn(s)}}

/* ---------- Speicher ---------- */
const store={get(k,f){try{const v=localStorage.getItem('sp26_'+k);return v==null?f:JSON.parse(v)}catch(e){return f}},set(k,v){try{localStorage.setItem('sp26_'+k,JSON.stringify(v))}catch(e){}}};

/* ---------- Termine ---------- */

    .forEach(([d,n],i)=>ev({mod:'get3',date:d,start:'16:00',end:'17:30',title:'Globalübung '+(i+1),room:'EF50, HS 1',note:n}));

    .forEach(([d,n],i)=>ev({mod:'get3',date:d,start:'16:00',end:'17:30',title:'Pflichtübung '+(i+1),room:'EF50, HS 1',note:n,pflicht:true,tier:'pfl'}));

  /* ML */
  ['2026-10-15','2026-10-22','2026-10-29','2026-11-05','2026-11-12','2026-11-26','2026-12-03','2026-12-10','2026-12-17','2027-01-07','2027-01-14','2027-01-21','2027-01-28']
    .forEach((d,i)=>ev({mod:'ml',date:d,start:'10:15',end:'11:45',title:'Vorlesung',room:'M/E 29',note:i<3?'Datum angenommen, Moodle zeigt noch Vorjahr':''}));
  [['2026-11-04','Statistik I'],['2026-11-18','Statistik II + Parameterschätzung'],['2026-12-02','Klassifikation I + II'],['2026-12-16','Regression'],['2027-01-13','Neuronale Netze'],['2027-01-20','Deep Learning & Gen AI']]
    .forEach(([d,n])=>ev({mod:'ml',date:d,start:'14:15',end:'15:45',title:'Übung',room:'HS ZE 15 (CT ZE)',note:n}));

  /* Pflichtübungen HBE + HST */
  const PUE={'2026-11-19':1,'2026-12-11':2,'2027-01-07':3,'2027-01-29':4};
  const pue=(d,start,end,room)=>ev({mod:'pue',date:d,start,end,title:'Pflichtübung '+PUE[d],room,note:'HBE und HST, je 20 min. 2 von 4 pro Fach nötig.',pflicht:true,tier:'pfl'});

  /* HST */
  weekly('2026-10-16',d=>{
    if(PUE[d]){pue(d,'10:15','10:35','HG II, HS 5');ev({mod:'hst',date:d,start:'10:35',end:'11:45',title:'Vorlesung',room:'HG II, HS 5'});}
    else ev({mod:'hst',date:d,start:'10:15',end:'11:45',title:'Vorlesung',room:'HG II, HS 5'});

  const hg=HST_G[cfg.hst];
  ['2026-11-13','2026-11-27','2026-12-11','2027-01-08','2027-01-22'].forEach((d,i)=>ev({mod:'hst',date:d,start:hg.t[0],end:hg.t[1],title:'Seminar '+(i+1)+' · Gr. '+cfg.hst,room:hg.room,note:'voraussichtlich',pflicht:true,tier:'sem'}));

  /* HBE */
  weekly('2026-10-15',d=>{
    if(PUE[d]){pue(d,'12:15','12:35','HG II, HS 3');ev({mod:'hbe',date:d,start:'12:35',end:'13:45',title:'Vorlesung',room:'HG II, HS 3'});}
    else ev({mod:'hbe',date:d,start:'12:15',end:'13:45',title:'Vorlesung',room:'HG II, HS 3'});
  });
  const bg=HBE_G[cfg.hbe];
  ['2026-11-02','2026-11-16','2026-11-30','2026-12-14','2027-01-11','2027-01-25'].forEach((m,i)=>ev({mod:'hbe',date:iso(add(D(m),bg.off)),start:bg.t[0],end:bg.t[1],title:'Seminar '+(i+1)+' · Gr. '+cfg.hbe,room:bg.room,pflicht:true,tier:'sem'}));
  ['2026-12-04','2027-01-15','2027-01-29'].forEach((d,i)=>ev({mod:'hbe',date:d,start:'23:59',end:'23:59',title:'Abgabe Praktikum '+(i+1),room:'Moodle',note:'LTspice-Bericht, Kurzfragen beantwortet jeder einzeln',pflicht:true,tier:'pfl',frist:true}));
  ev({mod:'hbe',date:'2026-10-16',start:'12:00',end:'12:00',title:'Seminaranmeldung öffnet',room:'LSF',note:'Gruppe 5 (Do 14:15) sichern',pflicht:true,tier:'pfl',frist:true});

  /* Ringvorlesung */
  weekly('2026-10-16',d=>ev({mod:'ring',date:d,start:'16:00',end:'17:30',title:'Webinar',room:'Online'}));

  E.forEach(e=>{e.s=mins(e.start);e.e=mins(e.end)});

  return E;
}

let EV=build(S);
const visible=()=>S.onlyP?EV.filter(e=>e.pflicht):EV;
const onDay=s=>visible().filter(e=>e.date===s);
const overlaps=(a,b)=>a!==b&&!a.frist&&!b.frist&&a.date===b.date&&a.s<b.e&&b.s<a.e;

/* ---------- Auswahl ---------- */
let todayIso=iso(new Date());
const MIN_W=monday(D(SEM_START)), MAX_W=monday(D(SEM_END));
function initialDay(){
  const n=new Date();let d=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  if(d.getDay()===6)d=add(d,2); else if(d.getDay()===0)d=add(d,1);
  if(iso(d)<SEM_START)d=D(SEM_START);
  if(iso(d)>SEM_END)d=D(SEM_END);
  return d;
}
let sel=initialDay();
const paged=()=>S.view==='tag'||S.view==='woche';
function neighbor(dir,from){
  from=from||sel;
  if(S.view==='tag'){let d=add(from,dir);while(isWE(d))d=add(d,dir);const s=iso(d);return(s<SEM_START||s>SEM_END)?null:d}
  if(S.view==='woche'){const m=add(monday(from),7*dir);if(m<MIN_W||m>MAX_W)return null;return add(m,(from.getDay()+6)%7)}
  return null;
}

/* ---------- Bausteine ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PIN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0114 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
const CHECK='<svg class="chk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const CAL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>';
function relDay(s){const n=dayDiff(s,todayIso);return n===0?'Heute':n===1?'Morgen':n===-1?'Gestern':''}
function countdown(s){const n=dayDiff(s,todayIso);return n===0?'heute':n===1?'morgen':n<0?'vorbei':'in '+n+' Tagen'}
function longDate(d){return d.getDate()+'. '+MONL[d.getMonth()]+(d.getFullYear()!==2026?' '+d.getFullYear():'')}
const shortKind=e=>e.title.replace(/ · Gr\. \d/,'').replace('Vorlesung','VL').replace(/Globalübung \d/,'GÜ').replace(/Pflichtübung \d/,'PÜ').replace(/Seminar \d/,'Seminar').replace('Sicherheitsunterweisung','Sicherheit').replace('Repetitorium','Rep.').replace('Fragestunde','Fragen');
const roomShort=r=>r.replace('Martin-Schmeißer-Weg 8, ','MSW 8, ').replace('Seminarraumgebäude 1, ','SRG 1, ');
const roomTiny=r=>roomShort(r).replace(/^HG II, /,'').replace(/^MSW 8, /,'').replace(/^SRG 1, /,'').replace(', ',' ').replace(' (CT ZE)','');
const modLabel=e=>e.mod==='pue'?'HBE + HST':MODS[e.mod].short;

function emptyHTML(t,sub){return `<div class="empty">${CAL}<b>${t}</b>${sub}</div>`}
function edgeHTML(i){return `<div class="pi">${emptyHTML(i<0?'Semesterbeginn':'Semesterende',i<0?'Davor gibt es keine Termine.':'Danach ist die Vorlesungszeit vorbei.')}</div>`}

function cardHTML(e,list,st){
  const c=list.filter(o=>overlaps(e,o));
  let live='';
  if(st&&st.t==='now')live=`<div class="cl"><i></i>Läuft gerade, noch ${fmtDur(st.rest)}</div>`;
  else if(st&&st.t==='next')live=`<div class="cl">Beginnt in ${fmtDur(st.in)}</div>`;
  return `<article class="card m-${e.mod} t-${e.tier}">
    <div class="ck"><span class="k">${esc(e.title)}</span>${e.pflicht?'<span class="bdg">Pflicht</span>':''}</div>
    <div class="ct">${esc(MODS[e.mod].name)}</div>
    ${e.room?`<div class="cm">${PIN}<span>${esc(e.room)}</span></div>`:''}
    ${e.note?`<div class="cn">${esc(e.note)}</div>`:''}
    ${c.length?`<div class="cx">Überschneidet sich mit ${c.map(o=>esc(MODS[o.mod].short+' '+shortKind(o))).join(', ')}</div>`:''}
    ${live}
    ${st&&st.t==='now'?`<div class="prog" style="width:${Math.max(4,Math.round(st.p*100))}%"></div>`:''}
  </article>`;
}

function dayHTML(d){
  const s=iso(d), all=onDay(s), fr=all.filter(e=>e.frist), list=all.filter(e=>!e.frist);
  const isToday=s===todayIso, nm=nowMin(), rel=relDay(s);
  const nP=all.filter(e=>e.pflicht).length;
  let h=`<div class="pi"><div class="dhead"><div><h2>${WDL[d.getDay()]}</h2><p>${rel?rel+', ':''}${longDate(d)}</p></div><div class="dsum">`;
  if(list.length)h+=`<span class="chip">${list.length} ${list.length===1?'Termin':'Termine'}</span>`;
  if(nP)h+=`<span class="chip strong">${nP} Pflicht</span>`;
  h+='</div></div>';
  if(fr.length)h+='<div class="frs">'+fr.map(e=>`<div class="frist m-${e.mod} t-pfl"><span class="fi">!</span><div class="fx"><b>${esc(e.title)}</b><span>${esc(MODS[e.mod].short)} · ${e.start==='23:59'?'bis 23:59 Uhr':'ab '+e.start+' Uhr'} · ${esc(e.room)}</span>${e.note?`<span>${esc(e.note)}</span>`:''}</div></div>`).join('')+'</div>';
  if(!list.length){
    const m=isFree(s)?['Vorlesungsfrei',s>='2026-12-23'?'Weihnachtspause, genieß die freie Zeit.':'An diesem Tag findet nichts statt.']
      :S.onlyP?['Keine Pflichttermine','Freiwillige Termine sind gerade ausgeblendet.']:['Frei','An diesem Tag steht nichts an.'];
    h+=fr.length?'':emptyHTML(m[0],m[1]);
  } else {
    let nextFound=false, end=-1;
    h+='<ol class="tl">';
    list.forEach(e=>{
      if(end>=0&&e.s-end>=30)h+=`<li class="gap" aria-hidden="true"><i></i><span>${fmtDur(e.s-end)} frei</span></li>`;
      end=Math.max(end,e.e);
      let st=null,past=false;
      if(isToday){
        if(e.e<=nm)past=true;
        else if(e.s<=nm)st={t:'now',rest:e.e-nm,p:(nm-e.s)/(e.e-e.s)};
        else if(!nextFound&&e.s-nm<=180){st={t:'next',in:e.s-nm};}
        if(!past&&(!st||st.t!=='now')&&e.s>nm)nextFound=true;
      }
      h+=`<li class="ev${past?' past':''}"><div class="evt"><b>${e.start}</b><span>${e.end}</span></div>${cardHTML(e,list,st)}</li>`;
    });
    h+='</ol>';
    if(isToday&&list.every(e=>e.e<=nm))h+='<p class="done">Für heute bist du durch.</p>';
  }
  return h+'</div>';
}

function weekHTML(d){
  const m=monday(d), days=[0,1,2,3,4].map(i=>add(m,i)), H0=480, H1=1080;
  const per=days.map(x=>onDay(iso(x)));
  if(!per.some(a=>a.length)){
    const free=days.every(x=>isFree(iso(x)));
    return `<div class="pi">${emptyHTML(free?'Vorlesungsfreie Woche':'Keine Termine',free?'Weihnachtspause, in dieser Woche findet nichts statt.':(S.onlyP?'Keine Pflichttermine in dieser Woche.':'In dieser Woche steht nichts an.'))}</div>`;
  }
  let h='<div class="pi"><div class="wg"><div></div>';
  days.forEach((x,i)=>{const s=iso(x);const hasF=per[i].some(e=>e.frist);h+=`<button class="wh${s===todayIso?' today':''}" data-open="${s}"><span>${WD[x.getDay()]}</span><b>${x.getDate()}</b>${hasF?'<i>Frist</i>':''}</button>`});
  h+=`<div class="hrs" style="height:${H1-H0}px">`;
  for(let t=H0+60;t<H1;t+=60)h+=`<span style="top:${t-H0}px">${t/60}</span>`;
  h+='</div>';
  days.forEach((x,i)=>{
    const s=iso(x), list=per[i].filter(e=>!e.frist), pos=new Map();
    let cols=[],group=[],gEnd=-1;
    const flush=()=>{const n=Math.max(...group.map(e=>pos.get(e).c))+1;group.forEach(e=>pos.get(e).n=n);group=[];cols=[]};
    list.forEach(e=>{
      if(group.length&&e.s>=gEnd)flush();
      let c=cols.findIndex(en=>en<=e.s);if(c<0){c=cols.length;cols.push(0)}cols[c]=e.e;
      pos.set(e,{c,n:1});group.push(e);gEnd=Math.max(gEnd,e.e);
    });
    if(group.length)flush();
    h+=`<div class="wc" style="height:${H1-H0}px">`;
    list.forEach(e=>{
      const p=pos.get(e), dur=Math.min(e.e,H1)-Math.max(e.s,H0), tiny=dur<30, top=Math.max(e.s,H0)-H0, ht=Math.max(dur-2,tiny?12:16), w=100/p.n;
      const room=roomTiny(e.room);
      const lbl=tiny?shortKind(e):MODS[e.mod].short;
      h+=`<button class="blk m-${e.mod} t-${e.tier}${tiny?' tiny':''}" data-open="${s}" style="top:${top+1}px;height:${ht}px;left:calc(${p.c*w}% + 2px);width:calc(${w}% - 4px)" aria-label="${esc(MODS[e.mod].short+' '+e.title+', '+e.start+' bis '+e.end)}"><b>${esc(lbl)}</b>${ht>=34?`<span>${esc(shortKind(e))}</span>`:''}${ht>=56?`<span>${esc(room)}</span>`:''}</button>`;
    });
    if(s===todayIso){const nm=nowMin();if(nm>=H0&&nm<=H1)h+=`<div class="nowl" style="top:${nm-H0}px"></div>`}
    h+='</div>';
  });
  h+='</div><div class="leg"><span><i class="l1"></i>freiwillig</span><span><i class="l2"></i>Seminar</span><span><i class="l3"></i>Pflicht</span></div></div>';
  return h;
}

function isUp(e){if(e.date!==todayIso)return e.date>todayIso;const nm=nowMin();return e.frist?e.s>=nm:e.e>nm}
function pflichtHTML(){
  const all=EV.filter(e=>e.pflicht);
  const up=all.filter(isUp), past=all.filter(e=>!isUp(e));
  let h='<div class="pi">';
  if(!up.length)h+=emptyHTML('Alles erledigt','Keine Pflichttermine mehr in diesem Semester.');
  else{
    const n=up[0], nd=D(n.date);
    const nm=nowMin(), running=n.date===todayIso&&!n.frist&&n.s<=nm;
    h+=`<div class="hero m-${n.mod} t-${n.tier}"><span class="hl">${running?'Gerade':'Als Nächstes'}</span><span class="ht">${esc(n.title)}</span><span class="hm">${esc(MODS[n.mod].name)}</span><span class="hm">${WD[nd.getDay()]} ${dm(nd)} · ${n.start==='23:59'?'bis 23:59':n.start} · ${esc(roomShort(n.room))}</span><span class="hc">${running?'läuft':countdown(n.date)}</span></div>`;
  }
  const rows=(S.showPast?past:[]).concat(up.slice(1));
  let last='';
  rows.forEach(e=>{
    const d=D(e.date), key=MONL[d.getMonth()]+' '+d.getFullYear(), isPast=!isUp(e);
    if(key!==last){h+=(last?'</div>':'')+`<h3 class="sh">${key}</h3><div class="lst">`;last=key}
    const cd=countdown(e.date), soon=!isPast&&dayDiff(e.date,todayIso)<=7;
    h+=`<div class="pr${isPast?' past':''}"><div class="pd m-${e.mod} t-${e.tier}"><b>${d.getDate()}</b><span>${WD[d.getDay()]}</span></div><div class="pt"><b>${esc(e.title)}</b><span>${esc(modLabel(e))} · ${e.start==='23:59'?'bis 23:59':e.start} · ${esc(roomShort(e.room))}</span></div><span class="pcd${soon?' soon':''}">${isPast?'erledigt':cd}</span></div>`;
  });
  if(last)h+='</div>';
  if(past.length)h+=`<button class="wide" id="pastBtn">${S.showPast?'Vergangene ausblenden':'Vergangene anzeigen ('+past.length+')'}</button>`;
  return h+'</div>';
}

function groupClash(mod,k){
  const cfg={hst:S.hst,hbe:S.hbe};cfg[mod]=k;
  const E=build(cfg), sems=E.filter(e=>e.mod===mod&&e.tier==='sem'), hits=new Set();
  sems.forEach(se=>E.forEach(o=>{if(o.mod!==mod&&overlaps(se,o))hits.add(MODS[o.mod].short+' '+shortKind(o))}));
  return [...hits];
}
function mehrHTML(){
  const grpList=(mod,G)=>'<div class="lst">'+Object.entries(G).map(([k,g])=>{const cl=groupClash(mod,+k);return `<button class="li" data-grp="${mod}:${k}" aria-pressed="${S[mod]==k}"><span class="lt"><b>Gruppe ${k}</b><span>${g.lbl} · ${esc(roomShort(g.room))}</span>${cl.length?`<em>Überschneidung mit ${esc(cl.join(', '))}</em>`:''}</span>${CHECK}</button>`}).join('')+'</div>';
  let h='<div class="pi">';
  h+=`<section class="grp"><h3>Seminar HST</h3>${grpList('hst',HST_G)}</section>`;
  h+=`<section class="grp"><h3>Seminar HBE</h3>${grpList('hbe',HBE_G)}</section>`;
  h+=`<section class="grp"><h3>Anzeige</h3><div class="lst"><label class="lrow" for="onlyP"><span class="lt"><b>Nur Pflichttermine</b><span>Vorlesungen und Übungen ausblenden</span></span><input type="checkbox" class="sw" id="onlyP"${S.onlyP?' checked':''}></label></div></section>`;
  h+='<section class="grp"><h3>Farben</h3><div class="lst"><div class="lg h"><span>Fach</span><span>frei</span><span>Seminar</span><span>Pflicht</span></div>';
  ['hoema','get3','ml','hst','hbe','ring'].forEach(m=>{h+=`<div class="lg"><span>${MODS[m].name}</span><span class="swt m-${m} t-frei"></span><span class="swt m-${m} t-sem"></span><span class="swt m-${m} t-pfl"></span></div>`});
  h+='<div class="lg"><span>Pflichtübung HBE + HST</span><span></span><span></span><span class="swt m-pue t-pfl"></span></div></div></section>';
  h+=`<section class="grp"><h3>Hinweise</h3><div class="lst"><ul class="notes">
    <li>Vorlesungszeit 12.10.2026 bis 05.02.2027, frei am 01.11. und vom 23.12. bis 04.01. GET 3 hat laut eigenem Plan schon am 05.01. Vorlesung.</li>
    <li>ML-Vorlesung am 15.10., 22.10. und 29.10.: Moodle zeigt noch Daten vom Vorjahr, Donnerstag angenommen.</li>
    <li>HöMa-Übung startet angenommen ab 19.10.</li>
    <li>GET 3 Globalübung: Jahreszahlen auf der Seite veraltet, Mittwochstermine übernommen.</li>
    <li>HST-Seminare sind laut Lehrstuhl „voraussichtlich“. HST-Praktika haben noch keine Termine.</li>
  </ul></div></section>`;
  h+='<p class="foot">Stand der Termine: 13.10.2026</p></div>';
  return h;
}

/* ---------- Rendern ---------- */
const $=id=>document.getElementById(id);
const pager=$('pager'), track=$('track'), single=$('single'), panels=[...track.children];
const reduce=()=>window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const panelHTML=d=>S.view==='woche'?weekHTML(d):dayHTML(d);

function renderHeader(d){
  d=d||sel;
  const pg=paged();
  $('todayBtn').hidden=!pg; $('prevBtn').hidden=!pg; $('nextBtn').hidden=!pg;
  $('strip').hidden=S.view!=='tag';
  if(pg){
    const m=monday(d), f=add(m,4);
    $('hTitle').innerHTML=`${MONL[d.getMonth()]} <span>${d.getFullYear()}</span>`;
    $('hSub').textContent=`KW ${kwOf(m)} · ${dm(m)}–${dm(f)}`;
    $('prevBtn').disabled=m<=MIN_W; $('nextBtn').disabled=m>=MAX_W;
    if(S.view==='tag'){
      let h='';
      for(let i=0;i<5;i++){
        const x=add(m,i), s=iso(x), evs=onDay(s);
        const mods=[...new Set(evs.filter(e=>e.pflicht).map(e=>e.mod==='pue'?'hst':e.mod))].slice(0,3);
        h+=`<button class="sd${s===iso(d)?' sel':''}${s===todayIso?' today':''}" data-d="${s}" aria-label="${WDL[x.getDay()]}, ${longDate(x)}" aria-pressed="${s===iso(d)}"><span class="wd">${WD[x.getDay()]}</span><span class="dn">${x.getDate()}</span><span class="dots">${mods.map(mm=>`<i style="background:var(--${mm}-sem)"></i>`).join('')}</span></button>`;
      }
      $('strip').innerHTML=h;
    }
  } else if(S.view==='pflicht'){
    const n=EV.filter(e=>e.pflicht&&isUp(e)).length;
    $('hTitle').textContent='Pflicht'; $('hSub').textContent=n?`${n} anstehende Termine und Fristen`:'Nichts mehr offen';
  } else {
    $('hTitle').textContent='Einstellungen'; $('hSub').textContent='Seminargruppen, Anzeige, Farben';
  }
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.v===S.view));
}
function renderPanels(reset){
  [-1,0,1].forEach((i,k)=>{const p=panels[k], d=i===0?sel:neighbor(i);p.innerHTML=d?panelHTML(d):edgeHTML(i);if(reset)p.scrollTop=0});
  renderHeader(sel);
}
function renderSingle(){single.innerHTML=S.view==='pflicht'?pflichtHTML():mehrHTML()}
function fadeIn(el){el.classList.remove('fade');void el.offsetWidth;el.classList.add('fade')}
function setView(v){
  if(anim)return;
  S.view=v; store.set('view',v);
  pager.hidden=!paged(); single.hidden=paged();
  if(paged()){renderPanels(true);fadeIn(panels[1])}
  else{renderSingle();single.scrollTop=0;fadeIn(single)}
  renderHeader(sel);
}

/* ---------- Wischen ---------- */
let anim=false, drag=null, suppress=0;
const DUR=()=>reduce()?0:280;
function setT(x,ms,ease){track.style.transition=ms?`transform ${ms}ms ${ease||'cubic-bezier(.22,.8,.24,1)'}`:'none';track.style.transform=`translate3d(${x}px,0,0)`}
function commit(dir,target){
  if(anim)return;
  target=target||neighbor(dir);
  if(!target){snapBack();return}
  const side=panels[dir<0?0:2];
  side.innerHTML=panelHTML(target); side.scrollTop=0;
  anim=true; renderHeader(target);
  const w=pager.clientWidth, ms=DUR();
  const finish=()=>{sel=target;renderPanels(true);setT(0,0);void track.offsetWidth;anim=false};
  if(!ms){finish();return}
  requestAnimationFrame(()=>setT(-dir*w,ms));
  setTimeout(finish,ms+40);
}
function snapBack(){setT(0,DUR()?220:0,'cubic-bezier(.3,.7,.3,1)')}
pager.addEventListener('touchstart',e=>{
  if(anim||e.touches.length>1){drag=null;return}
  const t=e.touches[0];drag={x:t.clientX,y:t.clientY,t:performance.now(),lx:t.clientX,lt:performance.now(),v:0,axis:null,dx:0,w:pager.clientWidth};
},{passive:true});
pager.addEventListener('touchmove',e=>{
  if(!drag)return;
  const t=e.touches[0], dx=t.clientX-drag.x, dy=t.clientY-drag.y;
  if(!drag.axis){
    if(Math.abs(dx)<9&&Math.abs(dy)<9)return;
    drag.axis=Math.abs(dx)>Math.abs(dy)*1.2?'x':'y';
    if(drag.axis==='x'){drag.has={'-1':!!neighbor(-1),'1':!!neighbor(1)};setT(0,0)}
  }
  if(drag.axis!=='x')return;
  if(e.cancelable)e.preventDefault();
  const now=performance.now();if(now-drag.lt>0){drag.v=(t.clientX-drag.lx)/(now-drag.lt);drag.lx=t.clientX;drag.lt=now}
  let d=dx;if((d>0&&!drag.has['-1'])||(d<0&&!drag.has['1']))d*=.25;
  drag.dx=d;track.style.transform=`translate3d(${d}px,0,0)`;
},{passive:false});
function endDrag(){
  if(!drag)return;const g=drag;drag=null;
  if(g.axis!=='x')return;
  suppress=Date.now()+350;
  const dir=g.dx<0?1:-1, fling=Math.abs(g.v)>.45&&Math.sign(g.v)===Math.sign(g.dx)&&Math.abs(g.dx)>24;
  if(g.has[dir]&&(Math.abs(g.dx)>g.w*.24||fling))commit(dir);else snapBack();
}
pager.addEventListener('touchend',endDrag);
pager.addEventListener('touchcancel',endDrag);

/* ---------- Bedienung ---------- */
pager.addEventListener('click',e=>{
  if(Date.now()<suppress||anim)return;
  const b=e.target.closest('[data-open]');if(!b)return;
  sel=D(b.dataset.open);setView('tag');
});
$('strip').addEventListener('click',e=>{
  const b=e.target.closest('.sd');if(!b||anim)return;
  const t=D(b.dataset.d);if(iso(t)===iso(sel))return;
  commit(t>sel?1:-1,t);
});
function stepWeek(dir){
  if(anim||!paged())return;
  if(S.view==='woche'){commit(dir);return}
  let t=add(sel,7*dir);
  if(iso(t)<SEM_START)t=D(SEM_START); if(iso(t)>SEM_END)t=D(SEM_END);
  if(iso(t)!==iso(sel))commit(dir,t);
}
$('prevBtn').onclick=()=>stepWeek(-1);
$('nextBtn').onclick=()=>stepWeek(1);
function goToday(){
  if(anim)return;
  const t=initialDay();
  if(!paged()){sel=t;setView('tag');return}
  if(iso(t)===iso(sel)){panels[1].scrollTo({top:0,behavior:reduce()?'auto':'smooth'});return}
  if(S.view==='woche'&&iso(monday(t))===iso(monday(sel))){sel=t;renderPanels(false);return}
  commit(t>sel?1:-1,t);
}
$('todayBtn').onclick=goToday;
document.querySelector('.tabbar').addEventListener('click',e=>{
  const b=e.target.closest('.tab');if(!b)return;
  if(b.dataset.v===S.view){if(S.view==='tag')goToday();else(paged()?panels[1]:single).scrollTo({top:0,behavior:'smooth'});return}
  setView(b.dataset.v);
});
single.addEventListener('click',e=>{
  const g=e.target.closest('[data-grp]');
  if(g){const[mod,k]=g.dataset.grp.split(':');S[mod]=+k;store.set(mod,S[mod]);EV=build(S);const st=single.scrollTop;renderSingle();single.scrollTop=st;return}
  if(e.target.closest('#pastBtn')){S.showPast=!S.showPast;const st=single.scrollTop;renderSingle();single.scrollTop=st}
});
single.addEventListener('change',e=>{if(e.target.id==='onlyP'){S.onlyP=e.target.checked;store.set('onlyP',S.onlyP)}});
document.addEventListener('keydown',e=>{if(!paged())return;if(e.key==='ArrowRight')commit(1);if(e.key==='ArrowLeft')commit(-1)});

/* ---------- Uhr ---------- */
function refresh(){
  if(anim||drag)return;
  const t=iso(new Date());
  if(t!==todayIso){todayIso=t;sel=initialDay();if(paged())renderPanels(true);else renderSingle();renderHeader(sel);return}
  if(paged()){const st=panels[1].scrollTop;panels[1].innerHTML=panelHTML(sel);panels[1].scrollTop=st;renderHeader(sel)}
  else if(S.view==='pflicht'){const st=single.scrollTop;renderSingle();single.scrollTop=st;renderHeader(sel)}
}
setInterval(refresh,30000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refresh()});

/* ---------- Start ---------- */
pager.hidden=!paged(); single.hidden=paged();
if(paged())renderPanels(true); else renderSingle();
renderHeader(sel);
})();
</script>
</body>
</html>
